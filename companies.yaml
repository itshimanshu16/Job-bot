# ─────────────────────────────────────────────────────────────────────────────
#  Companies to watch, grouped by the job board they use.
#  The value is the company's "slug": the part after the board's domain in its job page URL.
#
#    job-boards.greenhouse.io/groww         -> greenhouse: groww
#    jobs.lever.co/cred                     -> lever: cred
#    jobs.ashbyhq.com/atlan                 -> ashby: atlan
#    careers.smartrecruiters.com/Freshworks -> smartrecruiters: Freshworks
#
#  Checked with:
#    python -m jobradar check
# ─────────────────────────────────────────────────────────────────────────────

