# ─────────────────────────────────────────────────────────────────────────────
#  Job Radar settings. Edit this file, then run:  python -m jobradar run
#  Candidate profile, target tracks and resume mappings are in profiles.yaml.
#  Words are matched case-insensitively as whole words ("sql" won't match "nosql").
# ─────────────────────────────────────────────────────────────────────────────

search:
  # Also keep jobs whose description (not title) mentions a keyword. Finds more, but noisier.
  search_description: false

  # Drop jobs whose title has any of these words.
  exclude_title: [senior, sr, sr., lead, principal, staff, manager, director, head of, vp, vice president, chief]

  # Drop jobs whose description contains any of these phrases.
  exclude_text: [walk-in, walk in interview]

  # Places to always skip, even if remote.
  exclude_locations: []

  # When a job doesn't say how much experience it needs: keep or drop.
  unknown_experience: keep

  # Ignore postings older than this many days.
  max_age_days: 21

  # Jobs scoring below this (0-100) are left out of the report.
  min_score: 35

output:
  dir: web/public/data   # where the React app reads jobs.json from
  title: Job Radar
  max_jobs: 400
  new_window_hours: 24   # a job counts as "new" for this long after it first appears

fetch:
  concurrency: 8
  timeout_seconds: 25

# Optional: let an AI model re-rank the top jobs against the winning track profile.
llm:
  enabled: true
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  model: gemini-2.5-flash
  fallback_models:
    - gemini-2.0-flash
    - gemini-1.5-flash
    - gemini-flash-latest
    - gemini-2.5-pro
  api_key_env: LLM_API_KEY
  max_jobs_per_run: 40            # only the top jobs are sent; each job is scored once and cached
  weight: 0.5                     # 0 = ignore AI score, 1 = use only the AI score
  timeout_seconds: 25             # fail fast on congested model servers
  max_retries: 2                  # retries before switching to next fallback

state:
  path: state/seen.json
  forget_after_days: 45
